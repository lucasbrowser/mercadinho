server:
  port: ${PORTA_SERVIDOR_LOCAL:8080}
spring:
  application:
    name: servidor-local-mercadinho
  datasource:
    url: ${URL_BANCO:jdbc:postgresql://localhost:5433/mercadinho}
    username: ${USUARIO_BANCO:mercadinho}
    password: ${SENHA_BANCO:trocar-esta-senha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
