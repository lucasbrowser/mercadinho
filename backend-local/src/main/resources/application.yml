server:
  port: ${LOCAL_API_PORT:8080}
spring:
  application:
    name: mercadinho-local-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mercadinho}
    username: ${DB_USERNAME:mercadinho}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
