server:
  port: ${PORTA_API_NUVEM:8081}
spring:
  application:
    name: api-nuvem-mercadinho
  datasource:
    url: ${URL_BANCO_NUVEM:jdbc:postgresql://localhost:5434/mercadinho_nuvem}
    username: ${USUARIO_BANCO_NUVEM:mercadinho}
    password: ${SENHA_BANCO_NUVEM:trocar-esta-senha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
