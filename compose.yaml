services:
  postgres-local:
    image: postgres:16
    container_name: mercadinho-postgres-local
    environment:
      POSTGRES_DB: mercadinho
      POSTGRES_USER: mercadinho
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-change-me}
    ports:
      - "5433:5432"
    volumes:
      - mercadinho_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercadinho -d mercadinho"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-cloud-dev:
    image: postgres:16
    container_name: mercadinho-postgres-cloud-dev
    profiles: ["cloud-dev"]
    environment:
      POSTGRES_DB: mercadinho_cloud
      POSTGRES_USER: mercadinho
      POSTGRES_PASSWORD: ${CLOUD_DB_PASSWORD:-change-me}
    ports:
      - "5434:5432"
    volumes:
      - mercadinho_cloud_data:/var/lib/postgresql/data

volumes:
  mercadinho_local_data:
  mercadinho_cloud_data:
